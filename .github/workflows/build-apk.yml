name: Build demo APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: no setup-android action — it requests the long-removed 'tools'
      # package and fails on current runner images. The ubuntu runner ships
      # the Android SDK preinstalled; install what we need directly.
      - name: Install SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build demo APKs
        run: gradle assembleMikeDemoDebug assembleBobDemoDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: demo-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 30
